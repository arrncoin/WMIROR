<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="#1e293b" stroke-width="6"/>
  
  <!-- Outer Phone Body -->
  <rect x="156" y="76" width="200" height="360" rx="36" fill="#090d16" stroke="url(#cyanGrad)" stroke-width="8"/>
  
  <!-- Screen Area -->
  <rect x="172" y="112" width="168" height="288" rx="20" fill="#0f172a"/>
  
  <!-- Camera Notch -->
  <circle cx="256" cy="94" r="6" fill="#1e293b"/>
  <circle cx="256" cy="94" r="2.5" fill="#38bdf8"/>
  
  <!-- Lightning / Low Latency GPU bolt inside screen -->
  <path d="M266 160 L226 250 L256 250 L246 340 L296 230 L266 230 Z" fill="url(#cyanGrad)"/>
  
  <!-- USB cable plug icon at bottom -->
  <rect x="236" y="444" width="40" height="24" rx="4" fill="#38bdf8"/>
  <rect x="246" y="468" width="20" height="20" rx="2" fill="#64748b"/>
  <circle cx="248" cy="456" r="3" fill="#0f172a"/>
  <circle cx="264" cy="456" r="3" fill="#0f172a"/>
